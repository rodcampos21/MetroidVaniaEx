<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120a18">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Contos do Abismo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya:wght@500&family=Alegreya+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>html{background:#050607} body{opacity:0;transition:opacity .2s}</style>
</head>
<body class="in-menu">
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="menu">
      <div class="stage">
        <div class="glow"></div>
        <div class="flash"></div>
        <div class="items">
          <button class="item sel" id="btnNew">Novo Jogo</button>
          <button class="item hidden" id="btnContinue">Continuar</button>
        </div>
        <div class="help">Setas/WASD mover · Z pular · X atacar (2× combo) · Shift dash · C rolar · ↓ agachar · Esc pausa</div>
      </div>
    </div>
  </div>

  <!-- Controles de toque (aparecem só em celular/tablet) -->
  <div id="touch">
    <div id="dpad"><div class="knob"></div></div>
    <div id="buttons">
      <button data-act="sprint" class="b-sprint">DASH</button>
      <button data-act="dash" class="b-dash">ROLAR</button>
      <button data-act="attack" class="b-atk">⚔</button>
      <button data-act="jump" class="b-jump">▲</button>
    </div>
    <button data-act="pause" id="pauseBtn">II</button>
  </div>

  <!-- Carregador: busca a versão mais nova (version.json nunca fica em cache)
       e só então carrega o estilo e os scripts. Assim cada atualização
       aparece na hora, sem o navegador usar arquivos antigos. -->
  <script>
    (function () {
      const FILES = ['js/rooms.js', 'js/themes.js', 'js/input.js', 'js/engine.js', 'js/pixel.js', 'js/hero.js', 'js/werewolf_sprite.js', 'js/guitarist_sprite.js', 'js/sprites.js', 'js/world.js', 'js/entities.js', 'js/boss.js', 'js/render.js', 'js/main.js'];
      const go = v => {
        const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'css/style.css?v=' + v;
        css.onload = css.onerror = () => { document.body.style.opacity = 1; };
        document.head.appendChild(css);
        let i = 0;
        const next = () => {
          if (i >= FILES.length) return;
          const s = document.createElement('script'); s.src = FILES[i++] + '?v=' + v; s.onload = next;
          document.body.appendChild(s);
        };
        next();
      };
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json()).then(j => go(j.v)).catch(() => go(Date.now()));
    })();
  </script>
</body>
</html>
