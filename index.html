<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090a">
  <title>MetroidVania EX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="in-menu">
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="menu">
      <div class="torch left"></div><div class="torch right"></div>
      <div class="hero"></div>
      <div class="logo">
        <h1>MetroidVania <span>EX</span></h1>
        <p class="sub">As Catacumbas Esquecidas</p>
      </div>
      <div class="buttons">
        <button id="btnContinue" class="hidden">Continuar</button>
        <button id="btnNew">Novo jogo</button>
      </div>
      <div class="help">
        Setas/WASD mover · Z/Espaço pular · X atacar (2× = combo) · Shift/V dash · C rolar · ↓ agachar · Esc pausa
      </div>
    </div>
  </div>

  <!-- Controles de toque (aparecem só em celular/tablet) -->
  <div id="touch">
    <div id="dpad"><div class="knob"></div></div>
    <div id="buttons">
      <button data-act="sprint" class="b-sprint">DASH</button>
      <button data-act="dash" class="b-dash">ROLAR</button>
      <button data-act="attack" class="b-atk">⚔</button>
      <button data-act="jump" class="b-jump">▲</button>
    </div>
    <button data-act="pause" id="pauseBtn">II</button>
  </div>

  <script src="js/rooms.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/input.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
